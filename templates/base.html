<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}Status Portal{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ asset_url('css/style.css') }}">
  <link rel="alternate" type="application/rss+xml" title="Status feed" href="{{ url_for('feed') }}">
  {% if site_logo_filename %}
  <link rel="icon" href="{{ url_for('static', filename='uploads/' ~ site_logo_filename) }}?v={{ site_logo_version }}">
  {% endif %}
  <script>
    // Applied before CSS paints, to avoid a flash of the wrong theme on load.
    // Mirrors theme.js's own fallback: no saved choice yet -> follow the OS preference.
    (function () {
      var saved = localStorage.getItem('portal-theme');
      var wantsLight = saved ? saved === 'light'
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
      if (wantsLight) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" style="position: fixed; top: 16px; right: 16px; z-index: 10;"
          title="Toggle light/dark theme" aria-label="Toggle light/dark theme">🌙</button>
  {% block body %}{% endblock %}
  <script src="{{ asset_url('js/theme.js') }}"></script>
  <script src="{{ asset_url('js/csrf.js') }}"></script>
</body>
</html>
