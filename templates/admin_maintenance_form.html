{% extends "admin_base.html" %}
{% block title %}Schedule maintenance — Admin{% endblock %}
{% block admin_content %}
<div class="admin-header">
  <h1>Schedule maintenance</h1>
</div>

<form method="POST" class="form-panel">
  <div class="field">
    <label for="service_id">Service</label>
    <select id="service_id" name="service_id" required>
      {% for s in services %}
        <option value="{{ s.id }}">{{ s.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="field">
    <label for="title">Title</label>
    <input type="text" id="title" name="title" required placeholder="e.g. Drive upgrade">
  </div>
  <div class="field">
    <label for="description">Description (optional)</label>
    <textarea id="description" name="description" placeholder="What's happening and why"></textarea>
  </div>
  <div class="field">
    <label for="starts_at">Starts at (UTC)</label>
    <input type="datetime-local" id="starts_at" name="starts_at" required>
  </div>
  <div class="field">
    <label for="ends_at">Ends at (UTC)</label>
    <input type="datetime-local" id="ends_at" name="ends_at" required>
    <div class="field-hint">Check the current UTC time before scheduling — the server compares against UTC, not your browser's local time.</div>
  </div>
  <div class="form-actions">
    <button type="submit" class="btn">Schedule</button>
    <a href="{{ url_for('admin_maintenance') }}" class="btn secondary">Cancel</a>
  </div>
</form>
{% endblock %}
</content>
