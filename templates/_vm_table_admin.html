<div class="admin-table">
  <table>
    <thead><tr><th>Name</th><th>State</th><th>Uptime</th><th></th></tr></thead>
    <tbody>
      {% for vm in vms %}
      <tr>
        <td>{{ vm.name }}</td>
        <td><span class="badge {{ 'resolved' if vm.state == 'Running' else 'investigating' }}">{{ vm.state }}</span></td>
        <td>{{ vm.uptime }}</td>
        <td class="actions">
          {% for action, label in [('start', 'Start'), ('restart', 'Restart'), ('stop', 'Stop')] %}
          <button type="button" class="btn secondary vm-control-trigger" style="padding:4px 10px;"
                  data-vm-name="{{ vm.name }}" data-action="{{ action }}" data-label="{{ label }}">{{ label }}</button>
          {% endfor %}
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
