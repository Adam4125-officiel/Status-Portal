<form method="GET" action="{{ url_for('search') }}" class="search-form">
  <input type="search" name="q" value="{{ query or '' }}" placeholder="Film or series title…"
         autocomplete="off" {% if search_autofocus %}autofocus{% endif %} maxlength="100" aria-label="Search the library">
  <button type="submit" class="btn">Search</button>
</form>
