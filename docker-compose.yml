services:
  status-portal:
    build: .
    ports:
      - "${HOST_PORT:-5000}:5000"
    environment:
      - PORTAL_SECRET_KEY=${PORTAL_SECRET_KEY}
      - PORTAL_CHECK_INTERVAL_SECONDS=${PORTAL_CHECK_INTERVAL_SECONDS:-120}
      - PORTAL_PUBLIC_REFRESH_SECONDS=${PORTAL_PUBLIC_REFRESH_SECONDS:-60}
      - PORTAL_MONITOR_DISK_PATH=${PORTAL_MONITOR_DISK_PATH:-/}
      - PORTAL_BEHIND_PROXY=${PORTAL_BEHIND_PROXY:-false}
      - PORTAL_FORCE_HTTPS_COOKIES=${PORTAL_FORCE_HTTPS_COOKIES:-false}
    volumes:
      - portal_data:/app/instance
    restart: unless-stopped

volumes:
  portal_data:
