name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests, lint and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      # requirements-discord.txt is needed too: several test modules import discord.py
      # and fail without it, which is how the suite runs on a developer machine.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt -r requirements-discord.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Ruff (advisory)
        continue-on-error: true
        run: |
          pip install ruff
          ruff check .

      - name: pip-audit (advisory)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements-dev.txt -r requirements-discord.txt
